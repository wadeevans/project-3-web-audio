<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Web Audio — 02 First Sound</title>
    <style>
        /* ── reset ── */
        *,
        *::before,
        *::after {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: sans-serif;
            background: #111;
            color: #eee;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
        }

        h1 {
            margin-bottom: 2rem;
            font-size: 1.5rem;
            letter-spacing: 0.05em;
        }

        #ui {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 1rem;
        }

        button {
            padding: 0.75rem 2rem;
            font-size: 1rem;
            background: #333;
            color: #eee;
            border: 1px solid #555;
            border-radius: 4px;
            cursor: pointer;
        }

        button:hover {
            background: #444;
        }
    </style>
</head>

<body>

    <h1>Web Audio 02 — First Sound</h1>

    <p>Set up the Audio Context - the foundation of all Web Audio</p>

    <div id="ui">
        <!-- controls will go here step by step -->
        <button id="btn-play">Play</button>
    </div>

    <script>
        // AudioContext goes here
        // Nodes go here
        // Event listeners go here

        const ctx = new AudioContext();

        const btn = document.getElementById('btn-play');

        btn.addEventListener('click', () => {
            console.log('button clicked — audio coming soon');
            if (ctx.state === 'suspended') ctx.resume();

            const osc = ctx.createOscillator();
            osc.type = 'sine';
            osc.frequency.value = 220;

            osc.connect(ctx.destination);
            osc.start();
            osc.stop(ctx.currentTime + 0.5);
        });
    </script>

</body>

</html>
